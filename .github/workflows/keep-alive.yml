name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 8 hours — comfortably under Streamlit's 12-hour sleep threshold
    - cron: '0 */8 * * *'
  workflow_dispatch:
    # Lets you manually trigger a ping from the Actions tab if you ever need to

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to keep it awake
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
          node -e "
            const { chromium } = require('playwright');
            (async () => {
              const browser = await chromium.launch();
              const page = await browser.newPage();
              await page.goto('https://whatsappchatsanalyser.streamlit.app/', { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(5000);
              console.log('Pinged successfully:', page.url());
              await browser.close();
            })();
          "